# Merge into ~/.codex/config.toml (or <repo>/.codex/config.toml).
# SWITCHBOARD_TOKEN must be in the environment Codex runs in. Replace the host with your switchboard's
# Tailscale name.
[mcp_servers.switchboard]
url = "http://switchboard.example.ts.net:7420/mcp"
bearer_token_env_var = "SWITCHBOARD_TOKEN"
# Without this, Codex refuses switchboard tool calls in non-interactive runs (exec, app-server) with
# "MCP tool call requires approval". Switchboard tools only use the message bus, nothing local.
# Values: auto | prompt | writes | approve (checked against codex-cli 0.153).
default_tools_approval_mode = "approve"
